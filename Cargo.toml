[workspace]
members = [
  "crates/nudge-agent",
  "crates/nudge-cli",
  "crates/nudge-daemon",
  "crates/nudge-protocol",
  "crates/nudge-pty",
  "crates/nudge-terminal",
]
resolver = "3"

[workspace.package]
edition = "2024"
license = "UNLICENSED"
repository = "https://nudgecode.dev"
rust-version = "1.95"

[workspace.dependencies]
anyhow = "1.0.100"
base64 = "0.22.1"
chacha20poly1305 = "0.10.1"
clap = { version = "4.5.53", features = ["derive"] }
crossterm = "0.29.0"
dirs = "6.0.0"
ed25519-dalek = "2.2.0"
futures-util = "0.3.32"
getrandom = "0.3.4"
hkdf = "0.12.4"
prost = "0.14.1"
prost-build = "0.14.1"
portable-pty = "0.9.0"
qrcode = { version = "0.14.1", default-features = false }
reqwest = { version = "0.12.24", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
sha2 = "0.10.9"
thiserror = "2.0.17"
tokio = { version = "1.48.0", features = ["io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
tokio-tungstenite = { version = "0.28.0", default-features = false, features = ["connect", "rustls-tls-webpki-roots"] }
unicode-width = "0.2.2"
url = "2.5.8"
vt100 = "0.16.2"
x25519-dalek = { version = "2.0.1", features = ["static_secrets"] }

[workspace]
members = [
  "crates/nudge-agent",
  "crates/nudge-cli",
  "crates/nudge-daemon",
  "crates/nudge-protocol",
  "crates/nudge-pty",
  "crates/nudge-terminal",
]
resolver = "3"

[workspace.package]
edition = "2024"
license = "UNLICENSED"
repository = "https://nudgecode.dev"
rust-version = "1.95"

[workspace.dependencies]
anyhow = "1.0.100"
clap = { version = "4.5.53", features = ["derive"] }
crossterm = "0.29.0"
dirs = "6.0.0"
futures-util = "0.3.32"
prost = "0.14.1"
prost-build = "0.14.1"
portable-pty = "0.9.0"
reqwest = { version = "0.12.24", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
thiserror = "2.0.17"
tokio = { version = "1.48.0", features = ["io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
tokio-tungstenite = { version = "0.28.0", default-features = false, features = ["connect", "rustls-tls-webpki-roots"] }
vt100 = "0.16.2"

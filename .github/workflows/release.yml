name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  rust-release:
    name: Rust ${{ matrix.target.os }} ${{ matrix.target.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-14
            target:
              os: macos
              arch: aarch64
          - runner: macos-15-intel
            target:
              os: macos
              arch: x86_64
          - runner: ubuntu-24.04
            target:
              os: linux
              arch: x86_64
          - runner: ubuntu-24.04-arm
            target:
              os: linux
              arch: aarch64

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        run: |
          if command -v rustup >/dev/null 2>&1; then
            rustup toolchain install stable --profile minimal
            rustup default stable
          else
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain stable
            echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          fi

      - name: Build nudge
        run: cargo build --release -p nudge-cli

      - name: Prepare release signing key
        env:
          NUDGE_RELEASE_SIGNING_KEY_PEM: ${{ secrets.NUDGE_RELEASE_SIGNING_KEY_PEM }}
          NUDGE_RELEASE_PUBLIC_KEY_PEM: ${{ vars.NUDGE_RELEASE_PUBLIC_KEY_PEM || secrets.NUDGE_RELEASE_PUBLIC_KEY_PEM }}
        run: |
          if [ -n "$NUDGE_RELEASE_SIGNING_KEY_PEM" ]; then
            printf '%s\n' "$NUDGE_RELEASE_SIGNING_KEY_PEM" > "$RUNNER_TEMP/nudge-release-signing-key.pem"
            chmod 600 "$RUNNER_TEMP/nudge-release-signing-key.pem"
            echo "NUDGE_SIGNING_KEY=$RUNNER_TEMP/nudge-release-signing-key.pem" >> "$GITHUB_ENV"
          fi
          if [ -n "$NUDGE_RELEASE_PUBLIC_KEY_PEM" ]; then
            printf '%s\n' "$NUDGE_RELEASE_PUBLIC_KEY_PEM" > "$RUNNER_TEMP/nudge-release-public.pem"
            echo "NUDGE_RELEASE_PUBLIC_KEY_FILE=$RUNNER_TEMP/nudge-release-public.pem" >> "$GITHUB_ENV"
          fi

      - name: Package release artifact
        run: scripts/package-release.sh
        env:
          NUDGE_VERSION: ${{ github.ref_type == 'tag' && github.ref_name || 'dev' }}
          NUDGE_TARGET_OS: ${{ matrix.target.os }}
          NUDGE_TARGET_ARCH: ${{ matrix.target.arch }}

      - name: Smoke installer against packaged artifact
        run: scripts/smoke-install.sh
        env:
          NUDGE_TARGET_OS: ${{ matrix.target.os }}
          NUDGE_TARGET_ARCH: ${{ matrix.target.arch }}

      - name: Prepare hosted install site shard
        run: |
          if [ -n "${NUDGE_SIGNING_KEY:-}" ]; then
            export NUDGE_REQUIRE_PUBLIC_KEY=1
          else
            export NUDGE_REQUIRE_PUBLIC_KEY=0
          fi
          scripts/prepare-install-site.sh
        env:
          NUDGE_VERSION: ${{ github.ref_type == 'tag' && github.ref_name || 'dev' }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: nudge-${{ matrix.target.os }}-${{ matrix.target.arch }}
          path: dist/releases/${{ github.ref_type == 'tag' && github.ref_name || 'dev' }}/nudge-${{ matrix.target.os }}-${{ matrix.target.arch }}.tar.gz*
          if-no-files-found: error

      - name: Upload hosted install site shard
        uses: actions/upload-artifact@v4
        with:
          name: install-site-${{ matrix.target.os }}-${{ matrix.target.arch }}
          path: dist/install-site/**
          if-no-files-found: error

  relay-container:
    name: Relay container
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Check relay container definition
        run: npm run check:relay-container

      - name: Prepare relay image metadata
        id: relay-image
        run: |
          owner="$(printf '%s' "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')"
          image="ghcr.io/$owner/nudge-relay"
          tags="nudge-relay:ci"
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            tags="$tags,$image:${GITHUB_REF_NAME},$image:latest"
          fi
          echo "image=$image" >> "$GITHUB_OUTPUT"
          echo "tags=$tags" >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        if: github.ref_type == 'tag'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build relay container
        run: docker build -f packages/relay/Dockerfile $(printf '%s' "${{ steps.relay-image.outputs.tags }}" | awk -F, '{ for (i = 1; i <= NF; i++) printf "-t %s ", $i }') .

      - name: Smoke relay container readiness
        run: |
          docker run -d --name nudge-relay \
            -p 8787:8787 \
            -e NUDGE_RELAY_STATE_PATH=/var/lib/nudge/relay-state.json \
            nudge-relay:ci
          ready=0
          for attempt in $(seq 1 40); do
            if curl -fsSL http://127.0.0.1:8787/readyz > "$RUNNER_TEMP/relay-readyz.json"; then
              ready=1
              break
            fi
            sleep 1
          done
          if [ "$ready" != "1" ]; then
            docker logs nudge-relay
            exit 1
          fi
          cat "$RUNNER_TEMP/relay-readyz.json"
          node - "$RUNNER_TEMP/relay-readyz.json" <<'NODE'
          const fs = require('node:fs');
          const ready = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'));
          const unexpected = [
            'websocket_signature_not_required',
            'websocket_challenge_not_required',
            'legacy_http_messages_enabled',
            'e2e_payload_not_required',
          ].filter((warning) => ready.warnings.includes(warning));
          if (!ready.config.hostedMode || !ready.config.statePersistence || unexpected.length > 0) {
            throw new Error(`relay container not hardened: ${JSON.stringify(ready)}`);
          }
          NODE

      - name: Stop relay container
        if: always()
        run: docker rm -f nudge-relay >/dev/null 2>&1 || true

      - name: Publish relay container
        if: github.ref_type == 'tag'
        run: |
          docker push "${{ steps.relay-image.outputs.image }}:${GITHUB_REF_NAME}"
          docker push "${{ steps.relay-image.outputs.image }}:latest"

  publish-github-release:
    name: Publish GitHub release
    if: github.ref_type == 'tag'
    needs:
      - rust-release
      - relay-container
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Publish release assets
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/nudge-*/*.tar.gz*

  publish-install-site-artifact:
    name: Publish install site artifact
    if: github.ref_type == 'tag'
    needs:
      - rust-release
      - publish-github-release
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: install-site-*
          path: install-site
          merge-multiple: true

      - name: Pack install site
        run: tar -czf nudge-install-site.tar.gz -C install-site .

      - name: Upload install site artifact
        uses: actions/upload-artifact@v4
        with:
          name: nudge-install-site
          path: nudge-install-site.tar.gz
          if-no-files-found: error

      - name: Publish install site release asset
        uses: softprops/action-gh-release@v2
        with:
          files: nudge-install-site.tar.gz

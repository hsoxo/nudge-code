name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rust-release:
    name: Rust ${{ matrix.target.os }} ${{ matrix.target.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-14
            target:
              os: macos
              arch: aarch64
          - runner: macos-15-intel
            target:
              os: macos
              arch: x86_64
          - runner: ubuntu-24.04
            target:
              os: linux
              arch: x86_64
          - runner: ubuntu-24.04-arm
            target:
              os: linux
              arch: aarch64

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        run: |
          if command -v rustup >/dev/null 2>&1; then
            rustup toolchain install stable --profile minimal
            rustup default stable
          else
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain stable
            echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          fi

      - name: Build nudge
        run: cargo build --release -p nudge-cli

      - name: Prepare release signing key
        env:
          NUDGE_RELEASE_SIGNING_KEY_PEM: ${{ secrets.NUDGE_RELEASE_SIGNING_KEY_PEM }}
        run: |
          if [ -n "$NUDGE_RELEASE_SIGNING_KEY_PEM" ]; then
            printf '%s\n' "$NUDGE_RELEASE_SIGNING_KEY_PEM" > "$RUNNER_TEMP/nudge-release-signing-key.pem"
            chmod 600 "$RUNNER_TEMP/nudge-release-signing-key.pem"
            echo "NUDGE_SIGNING_KEY=$RUNNER_TEMP/nudge-release-signing-key.pem" >> "$GITHUB_ENV"
          fi

      - name: Package release artifact
        run: scripts/package-release.sh
        env:
          NUDGE_VERSION: ${{ github.ref_type == 'tag' && github.ref_name || 'dev' }}
          NUDGE_TARGET_OS: ${{ matrix.target.os }}
          NUDGE_TARGET_ARCH: ${{ matrix.target.arch }}

      - name: Smoke installer against packaged artifact
        run: scripts/smoke-install.sh
        env:
          NUDGE_TARGET_OS: ${{ matrix.target.os }}
          NUDGE_TARGET_ARCH: ${{ matrix.target.arch }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: nudge-${{ matrix.target.os }}-${{ matrix.target.arch }}
          path: dist/releases/${{ github.ref_type == 'tag' && github.ref_name || 'dev' }}/nudge-${{ matrix.target.os }}-${{ matrix.target.arch }}.tar.gz*
          if-no-files-found: error

  relay-container:
    name: Relay container
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Check relay container definition
        run: npm run check:relay-container

      - name: Build relay container
        run: docker build -f packages/relay/Dockerfile -t nudge-relay:ci .

      - name: Smoke relay container readiness
        run: |
          docker run -d --name nudge-relay \
            -p 8787:8787 \
            -e NUDGE_RELAY_STATE_PATH=/var/lib/nudge/relay-state.json \
            nudge-relay:ci
          ready=0
          for attempt in $(seq 1 40); do
            if curl -fsSL http://127.0.0.1:8787/readyz > "$RUNNER_TEMP/relay-readyz.json"; then
              ready=1
              break
            fi
            sleep 1
          done
          if [ "$ready" != "1" ]; then
            docker logs nudge-relay
            exit 1
          fi
          cat "$RUNNER_TEMP/relay-readyz.json"
          node - "$RUNNER_TEMP/relay-readyz.json" <<'NODE'
          const fs = require('node:fs');
          const ready = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'));
          const unexpected = [
            'websocket_signature_not_required',
            'websocket_challenge_not_required',
            'legacy_http_messages_enabled',
            'e2e_payload_not_required',
          ].filter((warning) => ready.warnings.includes(warning));
          if (!ready.config.hostedMode || !ready.config.statePersistence || unexpected.length > 0) {
            throw new Error(`relay container not hardened: ${JSON.stringify(ready)}`);
          }
          NODE

      - name: Stop relay container
        if: always()
        run: docker rm -f nudge-relay >/dev/null 2>&1 || true

  publish-github-release:
    name: Publish GitHub release
    if: github.ref_type == 'tag'
    needs:
      - rust-release
      - relay-container
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Publish release assets
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*

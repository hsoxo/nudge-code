syntax = "proto3";

package nudge.v1;

message Envelope {
  string message_id = 1;
  oneof payload {
    AttachClient attach_client = 10;
    ClientExited client_exited = 11;
    GetState get_state = 12;
    SessionState session_state = 13;
    Error error = 14;
    DaemonStatusRequest daemon_status_request = 15;
    DaemonStatus daemon_status = 16;
    StopDaemon stop_daemon = 17;
    Ack ack = 18;
    TerminalInput terminal_input = 19;
    TerminalOutputRequest terminal_output_request = 20;
    TerminalOutput terminal_output = 21;
    CreateTab create_tab = 22;
    RenameTab rename_tab = 23;
    CloseTab close_tab = 24;
  }
}

message AttachClient {
  string client_id = 1;
}

message ClientExited {
  string client_id = 1;
}

message GetState {}

message DaemonStatusRequest {}

message DaemonStatus {
  string socket_path = 1;
  string state_path = 2;
  uint32 connected_clients = 3;
  uint64 uptime_seconds = 4;
  uint32 tabs = 5;
  string plan = 6;
}

message StopDaemon {}

message Ack {
  string message = 1;
}

message TerminalInput {
  string tab_id = 1;
  bytes data = 2;
}

message TerminalOutputRequest {
  string tab_id = 1;
  uint32 max_bytes = 2;
}

message TerminalOutput {
  string tab_id = 1;
  bytes data = 2;
}

message CreateTab {
  string title = 1;
}

message RenameTab {
  string tab_id = 1;
  string title = 2;
}

message CloseTab {
  string tab_id = 1;
}

message SessionState {
  repeated Tab tabs = 1;
  Entitlement entitlement = 2;
}

message Tab {
  string id = 1;
  string title = 2;
  string status = 3;
}

message Entitlement {
  string plan = 1;
  uint32 max_bound_computers = 2;
  uint32 max_tabs_per_computer = 3;
}

message Error {
  string code = 1;
  string message = 2;
}

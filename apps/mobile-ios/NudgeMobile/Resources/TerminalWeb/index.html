<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <link rel="stylesheet" href="xterm.css">
  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      height: 100dvh;
      overflow: hidden;
      background: #050505;
    }

    #terminal {
      width: 100%;
      height: 100%;
      overflow: auto;
      background: #050505;
    }

    #terminal.phone .xterm {
      width: 100%;
    }

    #terminal.computer .xterm {
      width: var(--terminal-width, 900px);
      min-width: 100%;
    }

    .xterm {
      padding: 14px;
      box-sizing: border-box;
      min-height: 100%;
    }

    .xterm-viewport {
      overflow-y: auto;
    }

    /* Hide scrollbars; scrolling is via finger drag. */
    #terminal,
    .xterm-viewport {
      scrollbar-width: none;
      -ms-overflow-style: none;
    }
    #terminal::-webkit-scrollbar,
    .xterm-viewport::-webkit-scrollbar {
      width: 0;
      height: 0;
      display: none;
    }
  </style>
</head>
<body>
  <div id="terminal"></div>
  <script src="xterm.js"></script>
  <script src="addon-fit.js"></script>
  <script src="addon-webgl.js"></script>
  <script src="addon-unicode11.js"></script>
  <script>
    const container = document.getElementById('terminal');
    const term = new Terminal({
      convertEol: true,
      cursorBlink: false,
      disableStdin: false,
      allowProposedApi: true,
      fontFamily: 'ui-monospace, SFMono-Regular, Menlo, monospace',
      fontSize: 13,
      lineHeight: 1.35,
      scrollback: 2000,
      theme: {
        background: '#050505',
        foreground: '#E6E8EA',
        cursor: '#E6E8EA',
        selectionBackground: '#2D5B88'
      }
    });

    // The fit addon must be loaded before open() so the first layout pass can
    // measure the container correctly.
    const fitAddon = new FitAddon.FitAddon();
    term.loadAddon(fitAddon);
    term.open(container);

    // Wider Unicode glyph widths (best-effort; ignore if unavailable).
    try {
      const unicode11 = new Unicode11Addon.Unicode11Addon();
      term.loadAddon(unicode11);
      term.unicode.activeVersion = '11';
    } catch (error) {
      // fall back to the default unicode handling
    }

    // Prefer the WebGL renderer, falling back to the DOM renderer. The bare DOM
    // renderer can paint a black screen in WKWebView until a fit/reflow happens,
    // so an explicit renderer plus the refit() pass below keeps output visible.
    try {
      const webgl = new WebglAddon.WebglAddon();
      webgl.onContextLoss(() => webgl.dispose());
      term.loadAddon(webgl);
    } catch (error) {
      // DOM renderer remains active
    }

    // On iOS the xterm helper textarea would summon the system keyboard when the
    // terminal is focused. Input arrives through the native composer / shortcut
    // keys instead, so suppress the system keyboard here.
    const helperTextarea = container.querySelector('.xterm-helper-textarea');
    if (helperTextarea) {
      helperTextarea.inputMode = 'none';
      helperTextarea.setAttribute('virtualkeyboardpolicy', 'manual');
    }

    let lastReportedPhoneProfile = null;
    let resizeReportHandle = 0;
    let encoder = new TextEncoder();
    let replayBufferLimit = 64 * 1024;
    let snapshotState = {
      text: '',
      widthMode: 'phone',
      rows: 24,
      cols: 80
    };
    let replayBuffer = [];
    let liveBuffer = [];

    function cellWidth() {
      return term._core?._renderService?.dimensions?.css?.cell?.width || 8;
    }

    function cellHeight() {
      return term._core?._renderService?.dimensions?.css?.cell?.height || 17;
    }

    // Force a paint+measure pass. The double requestAnimationFrame is the key
    // WKWebView fix: it lets layout settle before xterm measures the cell size
    // and fits, which is what keeps the terminal from rendering all black.
    function refit() {
      requestAnimationFrame(() => {
        requestAnimationFrame(() => {
          const rect = container.getBoundingClientRect();
          if (rect.width === 0 || rect.height === 0) {
            return;
          }
          if (container.classList.contains('computer')) {
            return;
          }
          try {
            fitAddon.fit();
          } catch (error) {
            // ignore transient fit errors
          }
          reportPhoneProfile();
        });
      });
    }

    function measuredPhoneProfile() {
      return { rows: Math.max(term.rows, 1), cols: Math.max(term.cols, 1) };
    }

    function postPhoneProfile(profile) {
      if (lastReportedPhoneProfile &&
          lastReportedPhoneProfile.rows === profile.rows &&
          lastReportedPhoneProfile.cols === profile.cols) {
        return;
      }
      lastReportedPhoneProfile = profile;
      window.webkit?.messageHandlers?.phoneProfile?.postMessage(profile);
    }

    function postTerminalInput(data) {
      if (!data) {
        return;
      }
      window.webkit?.messageHandlers?.terminalInput?.postMessage({ data });
    }

    function reportPhoneProfile() {
      if (!container.classList.contains('phone')) {
        return;
      }
      postPhoneProfile(measuredPhoneProfile());
    }

    function schedulePhoneProfileReport() {
      clearTimeout(resizeReportHandle);
      resizeReportHandle = setTimeout(refit, 120);
    }

    function syncTerminalSize(widthMode, rows, cols) {
      const safeRows = Math.max(Number(rows) || 1, 1);
      const safeCols = Math.max(Number(cols) || 1, 1);
      container.classList.toggle('phone', widthMode !== 'computer');
      container.classList.toggle('computer', widthMode === 'computer');
      if (widthMode === 'computer') {
        container.style.setProperty('--terminal-width', `${Math.ceil(safeCols * cellWidth() + 28)}px`);
        term.resize(safeCols, safeRows);
      } else {
        container.style.removeProperty('--terminal-width');
        refit();
      }
    }

    function followCursor(widthMode) {
      requestAnimationFrame(() => {
        container.scrollTop = container.scrollHeight;
        if (widthMode !== 'computer') {
          container.scrollLeft = 0;
          return;
        }
        const cursorX = term.buffer.active.cursorX * cellWidth() + 14;
        const viewportStart = container.scrollLeft;
        const viewportEnd = viewportStart + container.clientWidth - 14;
        if (cursorX > viewportEnd) {
          container.scrollLeft = Math.max(cursorX - container.clientWidth + 40, 0);
        } else if (cursorX < viewportStart) {
          container.scrollLeft = Math.max(cursorX - 40, 0);
        }
      });
    }

    function base64ToBytes(base64) {
      if (!base64) {
        return new Uint8Array();
      }
      const binary = atob(base64);
      const bytes = new Uint8Array(binary.length);
      for (let i = 0; i < binary.length; i += 1) {
        bytes[i] = binary.charCodeAt(i);
      }
      return bytes;
    }

    function appendBounded(buffer, bytes) {
      for (const byte of bytes) {
        buffer.push(byte);
      }
      const overflow = buffer.length - replayBufferLimit;
      if (overflow > 0) {
        buffer.splice(0, overflow);
      }
    }

    function writeBytes(bytes) {
      if (!bytes || bytes.length === 0) {
        return;
      }
      term.write(bytes);
    }

    function resetAndReplay() {
      syncTerminalSize(snapshotState.widthMode, snapshotState.rows, snapshotState.cols);
      term.reset();
      term.write(snapshotState.text || '');
      writeBytes(new Uint8Array(replayBuffer));
      writeBytes(new Uint8Array(liveBuffer));
      followCursor(snapshotState.widthMode);
      refit();
    }

    window.nudgeTerminal = {
      setSnapshot(text, widthMode, rows, cols) {
        snapshotState.text = text || '';
        snapshotState.widthMode = widthMode || 'phone';
        snapshotState.rows = rows;
        snapshotState.cols = cols;
        resetAndReplay();
      },
      setReplayOutputBase64(base64) {
        replayBuffer.splice(0, replayBuffer.length, ...base64ToBytes(base64));
        liveBuffer.splice(0, liveBuffer.length);
        resetAndReplay();
      },
      writeOutputBase64(base64) {
        const bytes = base64ToBytes(base64);
        appendBounded(liveBuffer, bytes);
        writeBytes(bytes);
        followCursor(container.classList.contains('computer') ? 'computer' : 'phone');
      },
      writeOutput(text) {
        const bytes = encoder.encode(text || '');
        appendBounded(liveBuffer, bytes);
        writeBytes(bytes);
        followCursor(container.classList.contains('computer') ? 'computer' : 'phone');
      },
      setFontSize(px) {
        const size = Math.max(8, Math.min(28, Number(px) || 13));
        if (term.options.fontSize === size) {
          return;
        }
        term.options.fontSize = size;
        refit();
      }
    };

    term.onData(postTerminalInput);
    new ResizeObserver(schedulePhoneProfileReport).observe(container);

    // Finger-drag scrolling: xterm inside WKWebView does not scroll the
    // scrollback on a touch drag, so translate a vertical drag into terminal
    // scroll. Input is via the native composer, so this does not block typing.
    let touchLastY = null;
    let touchScrollAccum = 0;
    container.addEventListener('touchstart', (event) => {
      if (event.touches.length === 1) {
        touchLastY = event.touches[0].clientY;
        touchScrollAccum = 0;
      } else {
        touchLastY = null;
      }
    }, { passive: true });
    container.addEventListener('touchmove', (event) => {
      if (touchLastY === null || event.touches.length !== 1) {
        return;
      }
      const currentY = event.touches[0].clientY;
      touchScrollAccum += touchLastY - currentY;
      touchLastY = currentY;
      const height = cellHeight();
      if (height > 0) {
        const lines = Math.trunc(touchScrollAccum / height);
        if (lines !== 0) {
          touchScrollAccum -= lines * height;
          term.scrollLines(lines);
        }
      }
    }, { passive: true });
    container.addEventListener('touchend', () => {
      touchLastY = null;
    }, { passive: true });

    // Initial paint once the WKWebView has laid out.
    refit();
  </script>
</body>
</html>

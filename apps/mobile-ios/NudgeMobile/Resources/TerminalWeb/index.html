<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
  <link rel="stylesheet" href="xterm.css">
  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #050505;
    }

    #terminal {
      width: 100%;
      height: 100%;
      overflow: auto;
      background: #050505;
    }

    #terminal.phone .xterm {
      width: 100%;
    }

    #terminal.computer .xterm {
      width: var(--terminal-width, 900px);
      min-width: 100%;
    }

    .xterm {
      padding: 14px;
      box-sizing: border-box;
      min-height: 100%;
    }

    .xterm-viewport {
      overflow-y: auto;
    }
  </style>
</head>
<body>
  <div id="terminal"></div>
  <script src="xterm.js"></script>
  <script>
    const container = document.getElementById('terminal');
    const term = new Terminal({
      convertEol: true,
      cursorBlink: false,
      disableStdin: true,
      fontFamily: 'ui-monospace, SFMono-Regular, Menlo, monospace',
      fontSize: 13,
      lineHeight: 1.35,
      scrollback: 2000,
      theme: {
        background: '#050505',
        foreground: '#E6E8EA',
        cursor: '#E6E8EA',
        selectionBackground: '#2D5B88'
      }
    });

    term.open(container);

    function cellWidth() {
      return term._core?._renderService?.dimensions?.css?.cell?.width || 8;
    }

    function syncTerminalSize(widthMode, rows, cols) {
      const safeRows = Math.max(Number(rows) || 1, 1);
      const safeCols = Math.max(Number(cols) || 1, 1);
      container.classList.toggle('phone', widthMode !== 'computer');
      container.classList.toggle('computer', widthMode === 'computer');
      if (widthMode === 'computer') {
        container.style.setProperty('--terminal-width', `${Math.ceil(safeCols * cellWidth() + 28)}px`);
        term.resize(safeCols, safeRows);
      } else {
        container.style.removeProperty('--terminal-width');
        term.resize(safeCols, safeRows);
        requestAnimationFrame(() => {
          term.resize(Math.max(Math.floor((container.clientWidth - 28) / cellWidth()), 1), safeRows);
        });
      }
    }

    function followCursor(widthMode) {
      requestAnimationFrame(() => {
        container.scrollTop = container.scrollHeight;
        if (widthMode !== 'computer') {
          container.scrollLeft = 0;
          return;
        }
        const cursorX = term.buffer.active.cursorX * cellWidth() + 14;
        const viewportStart = container.scrollLeft;
        const viewportEnd = viewportStart + container.clientWidth - 14;
        if (cursorX > viewportEnd) {
          container.scrollLeft = Math.max(cursorX - container.clientWidth + 40, 0);
        } else if (cursorX < viewportStart) {
          container.scrollLeft = Math.max(cursorX - 40, 0);
        }
      });
    }

    window.nudgeTerminal = {
      setSnapshot(text, widthMode, rows, cols) {
        syncTerminalSize(widthMode, rows, cols);
        term.reset();
        term.write(text || '');
        followCursor(widthMode);
      },
      writeOutput(text) {
        term.write(text || '');
        followCursor(container.classList.contains('computer') ? 'computer' : 'phone');
      }
    };
  </script>
</body>
</html>

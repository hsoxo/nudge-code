name: NudgeMobile
options:
  bundleIdPrefix: dev.nudgecode
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
packages:
  SwiftProtobuf:
    url: https://github.com/apple/swift-protobuf.git
    from: 1.38.0
targets:
  NudgeMobile:
    type: application
    platform: iOS
    sources:
      - path: Generated
      - path: NudgeMobile/Sources/NudgeMobile
      - path: NudgeMobile/Resources/TerminalWeb
        type: folder
        buildPhase: resources
    dependencies:
      - package: SwiftProtobuf
    info:
      path: NudgeMobile/Sources/NudgeMobile/Info.plist
      properties:
        CFBundleDisplayName: Nudge
        UILaunchScreen:
          UIColorName: ""
        NSCameraUsageDescription: Nudge scans the computer pairing QR code to bind this phone.
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.nudgecode.NudgeMobile
        PRODUCT_MODULE_NAME: NudgeMobile
        PRODUCT_NAME: NudgeMobile
  NudgeMobileTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: NudgeMobile/Tests/NudgeMobileTests
    dependencies:
      - target: NudgeMobile
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: dev.nudgecode.NudgeMobileTests
schemes:
  NudgeMobile:
    build:
      targets:
        NudgeMobile: all
        NudgeMobileTests: [test]
    test:
      targets:
        - NudgeMobileTests
